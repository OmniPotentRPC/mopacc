[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
description = "C ABI for embedding OpenMOPAC AM1 (mopac_scf model=4)."
name = "mopacc"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[environments]
mopac = { features = ["mopac"] }

[dependencies]
compilers = ">=1.8.0,<2"
meson = ">=1.5.2,<2"
ninja = ">=1.11,<2"
pkgconf = ">=2.5.1,<3"
python = ">=3.10,<4"

[tasks]
test-stub = { cmd = "meson setup build -Dwith_tests=true && meson compile -C build && meson test -C build --print-errorlogs", description = "Configure, build, and test the stub" }
test-stub-sanitize = { cmd = "meson setup build-sanitize -Dwith_tests=true -Db_sanitize=address,undefined -Db_lundef=false && meson compile -C build-sanitize && ASAN_OPTIONS=detect_leaks=0 meson test -C build-sanitize --print-errorlogs", description = "Stub suite under ASan/UBSan" }

[feature.mopac]
# conda-forge OpenMOPAC for the real AM1 embed. Not on the default env.
platforms = ["linux-64"]

[feature.mopac.dependencies]
mopac = ">=23.2,<24"

[feature.mopac.tasks.test-mopac]
cmd = "meson setup build-mopac -Dwith_tests=true -Dwith_mopac=true -Dmopac_root=$CONDA_PREFIX && meson compile -C build-mopac && meson test -C build-mopac --print-errorlogs && ./build-mopac/host_hcn_am1"
description = "Real OpenMOPAC AM1 embed (mopac_scf model=4)"
