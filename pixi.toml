[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
description = "C ABI for embedding OpenMOPAC AM1 (mopac_scf, model 4)."
name = "mopacc"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
meson = ">=1.5.2,<2"
ninja = "*"
pkgconf = ">=2.5.1,<3"
compilers = ">=1.8.0,<2"
python = ">=3.10,<4"

[feature.mopac.dependencies]
mopac = ">=23.2"

[environments]
default = { features = [] }
mopac = { features = ["mopac"] }

[tasks]
stub = "meson setup build --wipe && meson compile -C build && meson test -C build"
embed = "meson setup build-mopac -Dwith_mopac=true -Dmopac_root=$CONDA_PREFIX && meson compile -C build-mopac && meson test -C build-mopac"
